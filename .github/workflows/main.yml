
name: Scorp Android - QEMU ARM32

on:
  workflow_dispatch:
  push:
    branches: [main, master]
    paths:
      - ".github/workflows/main.yml"
      - "scorp-overlay/**"

permissions:
  contents: read

concurrency:
  group: scorp-android-build
  cancel-in-progress: false

jobs:
  build:
    name: Build Scorp Android
    runs-on: ubuntu-22.04
    timeout-minutes: 180

    env:
      BUILD_HOST: armeabi-v7a
      BUILD_GUEST: arm-softmmu
      USE_QEMU_VERSION: "5.1.0"
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk

    steps:
      - name: Checkout Scorp project
        uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            git curl wget unzip zip xz-utils \
            build-essential make cmake ninja-build \
            autoconf automake libtool pkg-config \
            flex bison gettext python3 \
            binutils patch perl file \
            openjdk-11-jdk openjdk-17-jdk

      - name: Configure Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Locate existing Android SDK
        shell: bash
        run: |
          set -e

          test -d "$ANDROID_HOME"

          SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" \
            -type f -name sdkmanager -print -quit)"

          if [ -z "$SDKMANAGER" ]; then
            echo "::error::Android SDK sdkmanager was not found."
            exit 1
          fi

          echo "SDKMANAGER=$SDKMANAGER" >> "$GITHUB_ENV"
          echo "$(dirname "$SDKMANAGER")" >> "$GITHUB_PATH"
          echo "$ANDROID_HOME/platform-tools" >> "$GITHUB_PATH"

          echo "Android SDK: $ANDROID_HOME"
          "$SDKMANAGER" --version

      - name: Accept Android SDK licenses
        shell: bash
        run: |
          yes | "$SDKMANAGER" --licenses

      - name: Install Android SDK and NDK packages
        shell: bash
        run: |
          set -e

          "$SDKMANAGER" --install \
            "platform-tools" \
            "platforms;android-30" \
            "build-tools;30.0.3" \
            "ndk;23.2.8568313" \
            "cmake;3.22.1"

          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/23.2.8568313" >> "$GITHUB_ENV"
          echo "NDK_ROOT=$ANDROID_HOME/ndk/23.2.8568313" >> "$GITHUB_ENV"

      - name: Verify Android toolchain
        run: |
          set -e
          test -d "$ANDROID_NDK_HOME"
          test -d "$ANDROID_HOME/platforms/android-30"
          test -d "$ANDROID_HOME/build-tools/30.0.3"
          echo "Android SDK and NDK are ready."

      - name: Clone Limbo Android QEMU
        run: |
          set -e

          git clone --depth 1 \
            https://github.com/limboemu/limbo.git \
            "$RUNNER_TEMP/limbo"

          test -f "$RUNNER_TEMP/limbo/limbo-android-lib/src/main/jni/Makefile"
          test -d "$RUNNER_TEMP/limbo/limbo-android-arm"

          echo "LIMBO_DIR=$RUNNER_TEMP/limbo" >> "$GITHUB_ENV"

      - name: Configure ARM32 QEMU
        working-directory: ${{ runner.temp }}/limbo/limbo-android-lib/src/main/jni
        run: |
          set -e
          test -f Makefile
          test -d "$ANDROID_NDK_HOME"

          grep -R -n \
            -E 'BUILD_HOST|BUILD_GUEST|USE_QEMU_VERSION' \
            android-config android-limbo-config.mak Makefile \
            2>/dev/null || true

      - name: Build QEMU ARM engine
        working-directory: ${{ runner.temp }}/limbo/limbo-android-lib/src/main/jni
        env:
          BUILD_HOST: armeabi-v7a
          BUILD_GUEST: arm-softmmu
          USE_QEMU_VERSION: "5.1.0"
          USE_GCC: "false"
          NDK_ROOT: ${{ env.ANDROID_NDK_HOME }}
        run: |
          set -o pipefail
          make limbo 2>&1 | tee "$RUNNER_TEMP/qemu-build.log"

      - name: Connect QEMU serial
        working-directory: ${{ runner.temp }}/limbo
        run: |
          python3 <<'PY'
          from pathlib import Path
          import re

          files = list(Path(".").rglob("VMExecutor.java"))
          if not files:
              raise SystemExit("VMExecutor.java not found")

          target = None
          for path in files:
              source = path.read_text(errors="replace")
              if ('paramsList.add("-serial")' in source
                      and 'paramsList.add("none")' in source):
                  target = path
                  break

          if target is None:
              raise SystemExit(
                  "Could not find the expected QEMU serial configuration"
              )

          source = target.read_text()
          pattern = (
              r'(paramsList\.add\("-serial"\);\s*)'
              r'paramsList\.add\("none"\);'
          )
          updated, count = re.subn(
              pattern,
              r'\1paramsList.add("tcp:127.0.0.1:5555,server=on,wait=off");',
              source,
              count=1
          )

          if count != 1:
              raise SystemExit("Could not patch QEMU serial configuration")

          target.write_text(updated)
          print("QEMU serial patched:", target)
          PY

      - name: Verify native QEMU library
        working-directory: ${{ runner.temp }}/limbo
        run: |
          set -e

          find . -type f \
            \( -name 'libqemu-system-arm.so' \
            -o -name 'libqemu-system-aarch64.so' \) -print

          if ! find . -type f -name 'libqemu-system-arm.so' \
            -print -quit | grep -q .; then
            echo "::error::QEMU ARM library was not found."
            exit 1
          fi

      - name: Apply optional Scorpion overlay
        working-directory: ${{ runner.temp }}/limbo
        run: |
          if [ -d "$GITHUB_WORKSPACE/scorp-overlay" ]; then
            cp -a "$GITHUB_WORKSPACE/scorp-overlay/." .
            echo "Scorpion overlay applied."
          else
            echo "No scorp-overlay found; using Limbo's existing interface."
          fi

      - name: Build Android APK
        working-directory: ${{ runner.temp }}/limbo
        run: |
          set -e
          chmod +x ./gradlew

          export JAVA_HOME=/usr/lib/jvm/java-11-openjdk-amd64
          export PATH="$JAVA_HOME/bin:$PATH"

          java -version

          ./gradlew --no-daemon \
            :limbo-android-arm:assembleDebug

      - name: Collect APK and diagnostics
        if: always()
        run: |
          mkdir -p "$GITHUB_WORKSPACE/artifacts"

          if [ -d "$RUNNER_TEMP/limbo" ]; then
            find "$RUNNER_TEMP/limbo" -type f -name '*.apk' \
              -exec cp {} "$GITHUB_WORKSPACE/artifacts/" \; \
              2>/dev/null || true
          fi

          if [ -f "$RUNNER_TEMP/qemu-build.log" ]; then
            cp "$RUNNER_TEMP/qemu-build.log" \
              "$GITHUB_WORKSPACE/artifacts/"
          fi

          ls -lh "$GITHUB_WORKSPACE/artifacts" || true

      - name: Upload APK and diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: scorp-android-arm32
          path: artifacts/
          if-no-files-found: warn
          retention-days: 14
