
name: Scorp Android - QEMU ARM32

on:
  workflow_dispatch:
  push:
    branches: [main, master]
    paths:
      - ".github/workflows/main.yml"
      - "scorp-overlay/**"

permissions:
  contents: read

concurrency:
  group: scorp-android-build
  cancel-in-progress: false

jobs:
  build:
    name: Build Scorp Android
    runs-on: ubuntu-22.04
    timeout-minutes: 180

    env:
      BUILD_HOST: armeabi-v7a
      BUILD_GUEST: aarch64-softmmu
      USE_QEMU_VERSION: "5.1.0"
      USE_GCC: "false"
      USE_AAUDIO: "false"
      USE_KVM: "false"
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk

    steps:
      - name: Checkout Scorp project
        uses: actions/checkout@v4

      - name: Install build dependencies
        shell: bash
        run: |
          set -e

          sudo apt-get \
            -o Acquire::Retries=3 \
            -o Acquire::http::Timeout=30 \
            -o Acquire::https::Timeout=30 \
            update

          sudo apt-get \
            -o Acquire::Retries=3 \
            -o Acquire::http::Timeout=30 \
            -o Acquire::https::Timeout=30 \
            install -y \
            git curl wget unzip zip xz-utils \
            build-essential make cmake ninja-build \
            autoconf automake libtool pkg-config \
            flex bison gettext texinfo rsync \
            python3 binutils patch perl file \
            libglib2.0-dev

      - name: Configure Java 11
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "11"

      - name: Locate Android SDK
        shell: bash
        run: |
          set -e

          test -d "$ANDROID_HOME"

          SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" \
            -type f -name sdkmanager -print -quit)"

          if [ -z "$SDKMANAGER" ]; then
            echo "::error::sdkmanager was not found."
            exit 1
          fi

          echo "SDKMANAGER=$SDKMANAGER" >> "$GITHUB_ENV"
          echo "$(dirname "$SDKMANAGER")" >> "$GITHUB_PATH"
          echo "$ANDROID_HOME/platform-tools" >> "$GITHUB_PATH"

          "$SDKMANAGER" --version

      - name: Accept Android SDK licenses
        shell: bash
        run: |
          set -e
          "$SDKMANAGER" --licenses < <(yes)

      - name: Install Android SDK and NDK
        shell: bash
        run: |
          set -e

          "$SDKMANAGER" --install \
            "platform-tools" \
            "platforms;android-29" \
            "build-tools;29.0.3" \
            "ndk;23.2.8568313" \
            "cmake;3.22.1"

          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/23.2.8568313" >> "$GITHUB_ENV"
          echo "NDK_ROOT=$ANDROID_HOME/ndk/23.2.8568313" >> "$GITHUB_ENV"

      - name: Verify Android toolchain
        shell: bash
        run: |
          set -e

          test -x "$ANDROID_NDK_HOME/ndk-build"
          test -d "$ANDROID_HOME/platforms/android-29"
          test -d "$ANDROID_HOME/build-tools/29.0.3"

          echo "SDK, build-tools and NDK verified."

      - name: Clone Limbo source
        shell: bash
        run: |
          set -e

          git clone --depth 1 \
            https://github.com/limboemu/limbo.git \
            "$RUNNER_TEMP/limbo"

          test -f "$RUNNER_TEMP/limbo/gradlew"
          test -f "$RUNNER_TEMP/limbo/limbo-android-lib/src/main/jni/Makefile"
          test -f "$RUNNER_TEMP/limbo/limbo-android-lib/src/main/jni/patches/qemu-5.1.0.patch"

          echo "LIMBO_DIR=$RUNNER_TEMP/limbo" >> "$GITHUB_ENV"

      - name: Download and prepare native libraries
        shell: bash
        working-directory: ${{ runner.temp }}/limbo/limbo-android-lib/src/main/jni
        run: |
          set -e
          mkdir -p "$RUNNER_TEMP/limbo-sources"

          download() {
            local url="$1"
            local output="$2"

            wget \
              --tries=5 \
              --retry-connrefused \
              --timeout=30 \
              -O "$output" "$url"
          }

          download \
            "https://download.qemu.org/qemu-5.1.0.tar.xz" \
            "$RUNNER_TEMP/limbo-sources/qemu.tar.xz"

          download \
            "https://ftp.gnome.org/pub/GNOME/sources/glib/2.56/glib-2.56.1.tar.xz" \
            "$RUNNER_TEMP/limbo-sources/glib.tar.xz"

          download \
            "https://sourceware.org/pub/libffi/libffi-3.3.tar.gz" \
            "$RUNNER_TEMP/limbo-sources/libffi.tar.gz"

          download \
            "https://www.cairographics.org/releases/pixman-0.40.0.tar.gz" \
            "$RUNNER_TEMP/limbo-sources/pixman.tar.gz"

          download \
            "https://www.libsdl.org/release/SDL2-2.0.8.tar.gz" \
            "$RUNNER_TEMP/limbo-sources/SDL2.tar.gz"

          rm -rf qemu glib libffi pixman SDL2
          mkdir -p qemu glib libffi pixman SDL2

          tar -xf "$RUNNER_TEMP/limbo-sources/qemu.tar.xz" \
            --strip-components=1 -C qemu

          tar -xf "$RUNNER_TEMP/limbo-sources/glib.tar.xz" \
            --strip-components=1 -C glib

          tar -xf "$RUNNER_TEMP/limbo-sources/libffi.tar.gz" \
            --strip-components=1 -C libffi

          tar -xf "$RUNNER_TEMP/limbo-sources/pixman.tar.gz" \
            --strip-components=1 -C pixman

          tar -xf "$RUNNER_TEMP/limbo-sources/SDL2.tar.gz" \
            --strip-components=1 -C SDL2

          patch --forward -d qemu -p1 \
            < patches/qemu-5.1.0.patch

          patch --forward -d glib -p1 \
            < patches/glib-2.56.1.patch

          patch --forward -d SDL2 -p1 \
            < patches/sdl2-2.0.8.patch

          test -f qemu/configure
          test -f glib/configure
          test -f libffi/configure
          test -f pixman/configure
          test -f SDL2/configure

          echo "All native source archives and patches verified."

      - name: Configure NDK missing-dependency handling
        shell: bash
        working-directory: ${{ runner.temp }}/limbo/limbo-android-lib/src/main/jni
        run: |
          set -e

          if ! grep -q 'APP_ALLOW_MISSING_DEPS' Application.mk; then
            printf '\nAPP_ALLOW_MISSING_DEPS := true\n' >> Application.mk
          fi

          grep -n 'APP_ALLOW_MISSING_DEPS' Application.mk

      - name: Build QEMU ARM guest engine
        shell: bash
        working-directory: ${{ runner.temp }}/limbo/limbo-android-lib/src/main/jni
        env:
          BUILD_HOST: armeabi-v7a
          BUILD_GUEST: aarch64-softmmu
          USE_QEMU_VERSION: "5.1.0"
          USE_GCC: "false"
          USE_AAUDIO: "false"
          USE_KVM: "false"
          NDK_ROOT: ${{ env.ANDROID_NDK_HOME }}
        run: |
          set -o pipefail

          echo "=== Build configuration ==="
          echo "BUILD_HOST=$BUILD_HOST"
          echo "BUILD_GUEST=$BUILD_GUEST"
          echo "NDK_ROOT=$NDK_ROOT"

          make limbo 2>&1 | tee "$RUNNER_TEMP/qemu-build.log"

      - name: Verify native QEMU library
        shell: bash
        working-directory: ${{ runner.temp }}/limbo
        run: |
          set -e

          find limbo-android-arm/src/main/jniLibs \
            -type f -name 'libqemu-system-*.so' -print

          if ! find limbo-android-arm/src/main/jniLibs \
            -type f -name 'libqemu-system-aarch64.so' \
            -print -quit | grep -q .; then
            echo "::error::libqemu-system-aarch64.so was not generated."
            exit 1
          fi

          echo "QEMU AArch64 system engine found."

      - name: Patch QEMU serial backend
        shell: bash
        working-directory: ${{ runner.temp }}/limbo
        run: |
          set -e

          python3 <<'PY'
          from pathlib import Path
          import re

          candidates = list(Path(".").rglob("VMExecutor.java"))
          if not candidates:
              raise SystemExit("VMExecutor.java was not found")

          target = None
          for path in candidates:
              source = path.read_text(errors="replace")
              if (
                  'paramsList.add("-serial")' in source
                  and 'paramsList.add("none")' in source
              ):
                  target = path
                  break

          if target is None:
              raise SystemExit(
                  "Expected serial configuration was not found; "
                  "refusing to silently skip the patch."
              )

          source = target.read_text()
          pattern = (
              r'(paramsList\.add\("-serial"\);\s*)'
              r'paramsList.add\("none"\);'
          )

          updated, count = re.subn(
              pattern,
              r'\1paramsList.add("tcp:127.0.0.1:5555,server=on,wait=off");',
              source,
              count=1
          )

          if count != 1:
              raise SystemExit("Serial patch did not apply exactly once")

          target.write_text(updated)
          print("Serial backend patched:", target)
          PY

      - name: Apply optional Scorpion overlay
        shell: bash
        working-directory: ${{ runner.temp }}/limbo
        run: |
          set -e

          if [ -d "$GITHUB_WORKSPACE/scorp-overlay" ]; then
            cp -a "$GITHUB_WORKSPACE/scorp-overlay/." .
            echo "Scorpion overlay applied."
          else
            echo "No scorp-overlay directory; using existing Limbo UI."
          fi

      - name: Build Android APK
        shell: bash
        working-directory: ${{ runner.temp }}/limbo
        run: |
          set -e
          chmod +x ./gradlew
          java -version

          ./gradlew --no-daemon \
            :limbo-android-arm:assembleDebug

      - name: Collect APK and diagnostics
        if: always()
        shell: bash
        run: |
          mkdir -p "$GITHUB_WORKSPACE/artifacts"

          if [ -d "$RUNNER_TEMP/limbo" ]; then
            find "$RUNNER_TEMP/limbo" -type f -name '*.apk' \
              -exec cp {} "$GITHUB_WORKSPACE/artifacts/" \; \
              2>/dev/null || true
          fi

          for log in qemu-build.log; do
            if [ -f "$RUNNER_TEMP/$log" ]; then
              cp "$RUNNER_TEMP/$log" "$GITHUB_WORKSPACE/artifacts/"
            fi
          done

          ls -lh "$GITHUB_WORKSPACE/artifacts" || true

      - name: Upload APK and diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: scorp-android-arm32
          path: artifacts/
          if-no-files-found: warn
          retention-days: 14
